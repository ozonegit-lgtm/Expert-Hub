name: expert-hub

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$socket = @fsockopen("127.0.0.1", 9000);
          exit($$socket ? 0 : 1);'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 180s
    restart: unless-stopped
    networks:
      - expert-hub

  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - expert-hub

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-expert_hub}
      MYSQL_USER: ${DB_USERNAME:-expert_hub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-expert_hub_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - expert-hub

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-expert_hub}
      PMA_PASSWORD: ${DB_PASSWORD:-expert_hub_secret}
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - expert-hub

volumes:
  mysql_data:
  vendor_data:

networks:
  expert-hub:
    driver: bridge